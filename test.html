<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Combining CSS Selectors</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <h1>To Do List</h1>
    <h2>Monday</h2>
    <div class="box">
      <p class="box-text">Do something today!</p>
      <ul class="list">
        <li>do something</li>
        <li class="list-item">do something</li>
        <li class="list-item">do something</li>
      </ul>
    </div>

    <ul>
      <p class="list-p">Do something</p>
    </ul>
  </body>
</html>
